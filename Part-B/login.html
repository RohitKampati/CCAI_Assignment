<!-- CCAI UI/UX Assignment - Login Screen -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>College Circle AI</title>
    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #09090F;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            width: 320px;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 28px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: none;
            border-radius: 6px;
            outline: none;
            background-color: #1a1a2e;
            color: white;
        }

        input::placeholder {
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4d278f;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #3a2fd6;
        }

        .footer-text {
            margin-top: 15px;
            font-size: 14px;
            color: #ccc;
        }

        .footer-text span {
            color: white;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>College Circle AI</h1>

        <input type="email" placeholder="Enter your email">
        <input type="password" placeholder="Enter your password">

        <button>Start Learning</button>

        <div class="footer-text">
            New here? <span>Join the circle</span>
        </div>
    </div>

</body>
</html>
